services:
  - type: web
    name: foodshift-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: singapore
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: https://frontend-xi-six-10.vercel.app,https://frontend-6akl212se-rahisekos-projects.vercel.app,http://localhost:3000
