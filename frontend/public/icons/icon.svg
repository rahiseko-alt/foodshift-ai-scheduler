<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="foodshift-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.25" flood-color="#0f172a"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#foodshift-grad)"/>

  <!-- Inner calendar & clock motif -->
  <g filter="url(#shadow)">
    <!-- Calendar Card Base -->
    <rect x="88" y="108" width="336" height="308" rx="28" fill="#ffffff"/>
    
    <!-- Calendar Header Bar -->
    <path d="M 88 136 C 88 120.5 100.5 108 116 108 L 396 108 C 411.5 108 424 120.5 424 136 L 424 176 L 88 176 Z" fill="#ef4444"/>
    
    <!-- Calendar Pins -->
    <rect x="156" y="80" width="28" height="48" rx="8" fill="#cbd5e1"/>
    <rect x="328" y="80" width="28" height="48" rx="8" fill="#cbd5e1"/>
    
    <!-- FoodShift "F" & Clock Accent -->
    <!-- Grid elements -->
    <rect x="132" y="212" width="64" height="48" rx="10" fill="#3b82f6" opacity="0.9"/>
    <rect x="224" y="212" width="64" height="48" rx="10" fill="#10b981" opacity="0.9"/>
    <rect x="316" y="212" width="64" height="48" rx="10" fill="#f59e0b" opacity="0.9"/>

    <rect x="132" y="280" width="64" height="48" rx="10" fill="#8b5cf6" opacity="0.9"/>
    <rect x="224" y="280" width="64" height="48" rx="10" fill="#3b82f6" opacity="0.9"/>
    <rect x="316" y="280" width="64" height="48" rx="10" fill="#10b981" opacity="0.9"/>

    <!-- Bottom Wave / Shift Flow Line -->
    <path d="M 132 368 C 190 340 322 390 380 356" fill="none" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>
