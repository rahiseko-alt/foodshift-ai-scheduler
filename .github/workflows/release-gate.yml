# docs/EXECUTION_PLAN.md §15 の Release Gate を自動実行する。
#
# 従来 CI が存在せず、Release Gate は誰かが手で回さない限り実行されなかった。
# その結果 `ruff format` 不合格のコードが main に入っていた実績がある。
name: Release Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: バックエンド（静的解析・テスト・カバレッジ）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: 依存関係の導入
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: ruff（静的解析）
        run: ruff check .

      - name: ruff format（整形の確認）
        run: ruff format --check .

      - name: pytest（分岐カバレッジ 80% 以上）
        run: pytest --cov=app --cov-branch --cov-fail-under=80

  frontend:
    name: フロントエンド（型・Lint・ビルド）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: TypeScript（strict / エラー0）
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: 本番ビルド
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000

  e2e:
    name: E2E（実バックエンドに接続）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: バックエンドの導入と起動
        run: |
          pip install -r backend/requirements.txt
          cd backend
          ALLOWED_ORIGINS="http://localhost:3000" \
            uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/v1/health && break
            sleep 1
          done

      - name: フロントエンドの導入
        working-directory: frontend
        run: npm ci

      - name: Playwright ブラウザの導入
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Playwright 実行
        working-directory: frontend
        run: npx playwright test
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000

      - name: 失敗時の証跡を保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 7

  security:
    name: セキュリティ（依存脆弱性・危険なAPI）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # docs/SECURITY_RULES.md P1-10 が要求している依存脆弱性スキャン
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt

      # SAC-3: ユーザー入力のHTML直接描画を禁止
      - name: dangerouslySetInnerHTML が無いこと
        run: |
          count=$(grep -r "dangerouslySetInnerHTML" frontend/src/ | wc -l)
          echo "検出数: $count"
          test "$count" -eq 0
